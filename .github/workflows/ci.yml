name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies (Frontend)
        run: flutter pub get
        working-directory: frontendGossipGarden/src

      - name: Analyze (Frontend)
        run: flutter analyze
        working-directory: frontendGossipGarden/src

      - name: Run tests (Frontend)
        run: flutter test
        working-directory: frontendGossipGarden/src

  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (Backend)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backendGossipGarden

      - name: Run tests (Backend)
        run: pytest --tb=short
        working-directory: backendGossipGarden
